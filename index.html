<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SANJAY_OS v95.26 — Sanjay Suresh V. | Physics &amp; Astrophysics Portfolio</title>
  <meta name="description" content="Interactive 1990s retro pixelated desktop portfolio of Sanjay Suresh V. — B.Sc. Physics (Honours with Research), Computational Astrophysics, Experimental Optics, and Science Communication." />

  <!-- Pixel Fonts: Press Start 2P (Display/Titles) & VT323 (Crisp Retro Terminal/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. RETRO WIN95 / PIXEL OS DESIGN TOKENS & BASE RESET
       ========================================================================= */
    :root {
      --win-bg: #c0c0c0;
      --win-light: #ffffff;
      --win-mid: #dfdfdf;
      --win-shadow: #808080;
      --win-dark: #000000;
      --win-title-active: #000080;
      --win-title-grad: #1084d0;
      --win-title-inactive: #808080;
      --screen-bg: #1e1035;
      --accent-yellow: #ffd700;
      --accent-red: #c81e1e;
      --crt-green: #33ff33;
      --taskbar-h: 38px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important; /* Strict crisp 90s pixel edges */
      image-rendering: pixelated;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'VT323', monospace;
      font-size: 18px;
      line-height: 1.35;
      color: #000000;
      background-color: var(--screen-bg);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================================
       2. DESKTOP WALLPAPER (Pixel Sunset City Hero + Sunset Fallback Gradient)
       Place "wallpaper.png" (or "Pixel Sunset Hero in Retro City.png") in the
       same GitHub repository folder as index.html!
       ========================================================================= */
    #desktop {
      position: relative;
      width: 100vw;
      height: calc(100vh - var(--taskbar-h));
      overflow: hidden;
      background-color: #261447;
      background-image:
        url('./wallpaper.png'),
        linear-gradient(
          180deg,
          #2a1758 0%,
          #5c246e 26%,
          #a93b6b 48%,
          #e86a58 68%,
          #f6a45c 80%,
          #2b1a4a 80.5%,
          #180e2e 100%
        );
      background-size: cover, 100% 100%;
      background-position: center bottom, center center;
      background-repeat: no-repeat, no-repeat;
      image-rendering: pixelated;
    }

    /* Subtle dark vignette at the left icon column for guaranteed readability */
    #desktop::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(14, 8, 28, 0.52) 0%,
        rgba(14, 8, 28, 0.18) 38%,
        rgba(14, 8, 28, 0.05) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Optional Toggleable CRT Scanlines + Vignette Overlay */
    #crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%),
        radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.35) 100%);
      background-size: 100% 4px, 100% 100%;
      transition: opacity 0.2s steps(2);
    }

    #crt-overlay.crt-off {
      opacity: 0;
    }

    /* =========================================================================
       3. CLASSIC WIN95 3D BEVEL UTILITIES
       ========================================================================= */
    .bevel-out {
      background: var(--win-bg);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-dark);
      border-bottom: 2px solid var(--win-dark);
      box-shadow: inset -1px -1px 0 var(--win-shadow), inset 1px 1px 0 var(--win-mid);
    }

    .bevel-in {
      background: #ffffff;
      border-top: 2px solid var(--win-shadow);
      border-left: 2px solid var(--win-shadow);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      box-shadow: inset 1px 1px 0 var(--win-dark), inset -1px -1px 0 var(--win-mid);
    }

    .retro-btn {
      font-family: 'VT323', monospace;
      font-size: 17px;
      color: #000;
      background: var(--win-bg);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-dark);
      border-bottom: 2px solid var(--win-dark);
      box-shadow: inset -1px -1px 0 var(--win-shadow);
      padding: 3px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .retro-btn:active,
    .retro-btn.active {
      border-top: 2px solid var(--win-dark);
      border-left: 2px solid var(--win-dark);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      box-shadow: inset 1px 1px 0 var(--win-shadow);
      transform: translate(1px, 1px);
    }

    .retro-btn-primary {
      background: #000080;
      color: #ffffff;
    }

    .retro-btn-gold {
      background: #ffd700;
      color: #000000;
      font-weight: bold;
    }

    /* =========================================================================
       4. DESKTOP SHORTCUT ICONS (Multi-column responsive grid + Crisp Pills)
       ========================================================================= */
    #icon-grid {
      position: relative;
      z-index: 5;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(auto-fill, 88px);
      grid-auto-columns: 96px;
      gap: 6px 8px;
      padding: 12px;
      height: 100%;
      width: max-content;
      max-width: 100%;
      align-content: start;
    }

    .desktop-icon {
      width: 92px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
      cursor: pointer;
      border: 1px dotted transparent;
      background: transparent;
      color: #ffffff;
      text-align: center;
    }

    .desktop-icon:hover .icon-art,
    .desktop-icon:focus .icon-art {
      transform: translateY(-2px);
    }

    .desktop-icon:focus,
    .desktop-icon.selected {
      border: 1px dotted #ffd700;
    }

    .desktop-icon .icon-art {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.85));
      transition: transform 0.1s steps(2);
    }

    /* High-contrast retro dark pill behind labels so text pops over sunset sky */
    .desktop-icon .icon-label {
      font-family: 'VT323', monospace;
      font-size: 15px;
      line-height: 1.05;
      color: #ffffff;
      background: rgba(14, 8, 30, 0.82);
      border: 1px solid rgba(255, 215, 0, 0.35);
      padding: 1px 5px;
      text-shadow: 1px 1px 0 #000000;
      word-break: break-word;
      max-width: 90px;
    }

    .desktop-icon.selected .icon-label,
    .desktop-icon:focus .icon-label {
      background: #000080;
      border-color: #ffd700;
      color: #ffd700;
    }

    /* =========================================================================
       5. RETRO WINDOWS (Draggable, Resizable/Maximizable, Responsive)
       ========================================================================= */
    .os-window {
      position: absolute;
      display: none;
      flex-direction: column;
      min-width: 290px;
      max-width: 96vw;
      max-height: calc(100vh - var(--taskbar-h) - 16px);
      background: var(--win-bg);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-dark);
      border-bottom: 2px solid var(--win-dark);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.65), inset -1px -1px 0 var(--win-shadow);
    }

    .os-window.open {
      display: flex;
    }

    .os-window.minimized {
      display: none !important;
    }

    .os-window.maximized {
      top: 4px !important;
      left: 4px !important;
      width: calc(100vw - 8px) !important;
      height: calc(100vh - var(--taskbar-h) - 8px) !important;
      max-width: none !important;
      max-height: none !important;
    }

    .window-titlebar {
      height: 26px;
      background: linear-gradient(90deg, var(--win-title-inactive), #a0a0a0);
      color: #dfdfdf;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 2px 6px;
      cursor: move;
      flex-shrink: 0;
    }

    .os-window.active .window-titlebar {
      background: linear-gradient(90deg, var(--win-title-active), var(--win-title-grad));
      color: #ffffff;
    }

    .window-title-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }

    .window-title-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 0.4px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .win-ctrl-btn {
      width: 20px;
      height: 18px;
      background: var(--win-bg);
      color: #000000;
      border-top: 1.5px solid var(--win-light);
      border-left: 1.5px solid var(--win-light);
      border-right: 1.5px solid var(--win-dark);
      border-bottom: 1.5px solid var(--win-dark);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .win-ctrl-btn:active {
      border-top: 1.5px solid var(--win-dark);
      border-left: 1.5px solid var(--win-dark);
      border-right: 1.5px solid var(--win-light);
      border-bottom: 1.5px solid var(--win-light);
    }

    .window-menubar {
      background: var(--win-bg);
      border-bottom: 1px solid var(--win-shadow);
      padding: 2px 8px;
      font-size: 15px;
      display: flex;
      gap: 14px;
      color: #111;
      flex-shrink: 0;
    }

    .window-menubar span u {
      text-decoration: underline;
    }

    .window-body {
      margin: 4px;
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      user-select: text;
    }

    .window-statusbar {
      height: 22px;
      margin: 0 4px 4px 4px;
      padding: 1px 6px;
      font-size: 14px;
      color: #222;
      border-top: 1px solid var(--win-shadow);
      border-left: 1px solid var(--win-shadow);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    /* =========================================================================
       6. CONTENT TYPOGRAPHY, CARDS, BADGES & TERMINAL STYLES
       ========================================================================= */
    .pixel-h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      line-height: 1.5;
      color: #000080;
      margin-bottom: 6px;
    }

    .pixel-h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #800000;
      margin: 12px 0 6px 0;
      border-bottom: 2px dashed #808080;
      padding-bottom: 4px;
    }

    .retro-card {
      background: #f4f4f0;
      border: 2px solid #808080;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      padding: 10px;
      margin-bottom: 10px;
    }

    .retro-card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
    }

    .retro-card-title {
      font-weight: bold;
      font-size: 20px;
      color: #000080;
    }

    .retro-badge {
      display: inline-block;
      background: #000080;
      color: #ffd700;
      padding: 1px 6px;
      font-size: 15px;
      border: 1px solid #000;
    }

    .retro-badge-red {
      background: #9b111e;
      color: #ffffff;
    }

    .retro-badge-green {
      background: #0b5e20;
      color: #ffffff;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .skill-chip {
      background: #dfdfdf;
      border: 1px solid #000;
      box-shadow: 1px 1px 0 #808080;
      padding: 1px 7px;
      font-size: 16px;
    }

    .retro-list {
      padding-left: 18px;
      margin-top: 4px;
    }

    .retro-list li {
      margin-bottom: 3px;
    }

    /* DOS Terminal inside CONTACT.BAT */
    .dos-terminal {
      background: #000000;
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 17px;
      padding: 10px;
      border: 2px inset #808080;
      margin-top: 10px;
    }

    .dos-output {
      max-height: 130px;
      overflow-y: auto;
      margin-bottom: 6px;
      white-space: pre-wrap;
    }

    .dos-input-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dos-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 17px;
      flex: 1;
      width: 100%;
    }

    /* =========================================================================
       7. RETRO ARCADE GAMES STYLING
       ========================================================================= */
    .game-container {
      background: #120b24;
      color: #ffffff;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .game-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000000;
      border: 2px solid #555;
      padding: 4px 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #ffd700;
    }

    .game-canvas {
      background: #070410;
      border: 3px solid #808080;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
      display: block;
      max-width: 100%;
    }

    .game-controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .arcade-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 12px;
      background: #c0c0c0;
      color: #000;
      border-top: 3px solid #fff;
      border-left: 3px solid #fff;
      border-right: 3px solid #404040;
      border-bottom: 3px solid #404040;
      cursor: pointer;
      touch-action: manipulation;
    }

    .arcade-btn:active {
      border-top: 3px solid #404040;
      border-left: 3px solid #404040;
      border-right: 3px solid #fff;
      border-bottom: 3px solid #fff;
      background: #ffd700;
    }

    .arcade-btn-fire {
      background: #d92626;
      color: #fff;
    }

    /* Minesweeper Grid */
    .ms-board {
      display: grid;
      grid-template-columns: repeat(9, 28px);
      grid-template-rows: repeat(9, 28px);
      gap: 1px;
      background: #808080;
      border: 3px solid #808080;
    }

    .ms-cell {
      width: 28px;
      height: 28px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #000;
    }

    .ms-cell.revealed {
      background: #dcdcdc;
      border: 1px solid #999;
    }

    .ms-cell.mine {
      background: #e02424;
    }

    .ms-n1 { color: #0000ff; }
    .ms-n2 { color: #008000; }
    .ms-n3 { color: #ff0000; }
    .ms-n4 { color: #000080; }
    .ms-n5 { color: #800000; }
    .ms-n6 { color: #008080; }
    .ms-n7 { color: #000000; }
    .ms-n8 { color: #808080; }

    /* =========================================================================
       8. TASKBAR & START MENU
       ========================================================================= */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--taskbar-h);
      background: var(--win-bg);
      border-top: 2px solid var(--win-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 4px;
      z-index: 9000;
      gap: 4px;
    }

    #start-btn {
      height: 30px;
      padding: 0 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--win-bg);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-dark);
      border-bottom: 2px solid var(--win-dark);
      cursor: pointer;
      flex-shrink: 0;
    }

    #start-btn.active {
      border-top: 2px solid var(--win-dark);
      border-left: 2px solid var(--win-dark);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      background: #b0b0b0;
    }

    #taskbar-tasks {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      height: 100%;
    }

    .task-tab {
      height: 28px;
      min-width: 105px;
      max-width: 165px;
      padding: 0 8px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      background: var
